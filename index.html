<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gửi dữ liệu 维格表</title>
</head>
<body>
    <h2>📩 Gửi tin nhắn</h2>
    <input type="text" id="name" placeholder="Tên của bạn">
    <textarea id="content" placeholder="Nội dung tin nhắn"></textarea>
    <button onclick="sendData()">Gửi</button>
    <p id="status"></p>

    <script>
        // ============================================================
        // 🔑 CẤU HÌNH - Thay bằng thông tin thực tế của bạn
        // ============================================================
        const API_TOKEN = "uskLIB1kFYYlrNd9LKzRiSh";  // Token của bạn
        const DATASHEET_ID = "dst9xCMgSYUadTGJKX/viw7oElkd1rr0?token=54v4VDcrs0XA";   // ID bảng tính
        const FIELD_NAME = "Tên";                     // Tên cột trong bảng
        const FIELD_CONTENT = "Nội dung";             // Tên cột trong bảng
        // ============================================================

        async function sendData() {
            const name = document.getElementById('name').value.trim();
            const content = document.getElementById('content').value.trim();
            const status = document.getElementById('status');

            // Kiểm tra dữ liệu
            if (!name || !content) {
                status.style.color = 'red';
                status.innerText = '⚠️ Vui lòng nhập đầy đủ thông tin!';
                return;
            }

            status.style.color = 'blue';
            status.innerText = '⏳ Đang gửi...';

            // URL API - LƯU Ý: dùng đúng domain
            const url = `https://api.vika.cn/fusion/v1/datasheets/${DATASHEET_ID}/records`;

            // Dữ liệu gửi lên - đúng format theo tài liệu
            const payload = {
                records: [
                    {
                        fields: {
                            [FIELD_NAME]: name,
                            [FIELD_CONTENT]: content
                        }
                    }
                ]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // Kiểm tra kết quả
                if (response.ok && result.success) {
                    status.style.color = 'green';
                    status.innerText = '✅ Gửi thành công!';
                    document.getElementById('name').value = '';
                    document.getElementById('content').value = '';
                } else {
                    status.style.color = 'red';
                    status.innerText = `❌ Lỗi: ${result.message || 'Không xác định'}`;
                    console.error('Chi tiết lỗi:', result);
                }
            } catch (error) {
                status.style.color = 'red';
                status.innerText = `❌ Lỗi kết nối: ${error.message}`;
            }
        }
    </script>
</body>
</html>
